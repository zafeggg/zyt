# =============================================================
# 众赢币 ZYT 站点配置（域名 newzyt.com）
# 目标路径：/etc/nginx/sites-available/zyt
# 说明：
#   - listen 80 不带 default_server（修复与 default 的 duplicate 冲突）
#   - Host: newzyt.com → 本配置；Host: IP/其它 → default 兜底
#   - HTTPS 由 certbot --nginx 自动改写（追加 443 server 块 + 80→443 重定向）
#   - 前端 root 沿用 /var/www/html；API 反代 keeper pm2 8080
# =============================================================

server {
    listen 80;
    server_name newzyt.com;

    # ---------- 前端静态（Vite build 产物） ----------
    root /var/www/html;
    index index.html;

    # 防缓存策略（index.html 强制校验，assets 一年长缓存，根治旧版复活）
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反代 → keeper（pm2 zyt-keeper-mainnet, 8080） ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
